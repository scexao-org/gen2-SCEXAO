# 
# SCEXAO.yml -- SCEXAO launchers file 
#
# This is a YAML file

tabname: "SCEXAO IR"
launchers:
  -
    label: "Coro FPM"
    cmd: FPM OBE_ID=SCEXAO OBE_MODE=INFRA_RED SLOT=$VAL01
    params:
      - [ VAL01, LIST, [ "VVC", "OPEN", "LYOT78", "LYOT92", "LYOT113", "LYOT139", "LYOT165", "LYOT198", "LYOT228", "LYOT262", "LYOT310"], "Slot" ]

  -
    label: "MOVE_FPM_SIDEWAYS"
    cmd: FPM_SIDEWAYS OBE_ID=SCEXAO OBE_MODE=INFRA_RED

  -
    label: "Coro Lyot"
    cmd: LYOT OBE_ID=SCEXAO OBE_MODE=INFRA_RED SLOT=$VAL01
    params:
      - [ VAL01, LIST, [ "OPEN", "LYOT", "VVC", "MIRROR" ], "Slot" ]

  - sep

  -
    label: "IRCam Steering"
    cmd: IRCAM_STEERING OBE_ID=SCEXAO OBE_MODE=INFRA_RED MODE=$VAL01 A=$VAL02 B=$VAL03 MOTION=$VAL04
    params:
      - [ VAL01, LIST, [ "ONAXIS", "PALILAXY", "PALILAANGLE", "SKYANGLE"], "Mode" ]
      - [ VAL02, INPUT, 6, 0, "SEP X or R (arcsec)" ]
      - [ VAL03, INPUT, 6, 0, "SEP Y (arcsec) or Angle (deg)" ]
      - [ VAL04, LIST, [ ["Absolute", ABS], ["Relative", REL]], "Motion" ]

  -
    label: "CHARIS Pickoff"
    cmd: CHARIS_PICKOFF OBE_ID=SCEXAO OBE_MODE=INFRA_RED SLOT=$VAL01
    params:
      - [ VAL01, LIST, [ "T10R90", "T90R10", "ARWINDOW", "MIRROR", "1.12UMLP", "1.35UMLP", "1.88UMLP" ], "Slot" ]

  -
    label: "MEC Pickoff"
    cmd: MKIDS_PICKOFF OBE_ID=SCEXAO OBE_MODE=INFRA_RED SLOT=$VAL01
    params:
      - [ VAL01, LIST, [ "ARWINDOW", "MIRROR", "T10R90", "T90R10", "1.35UMSP" ], "Slot" ]

  -
    label: "CHARIS Filter"
    cmd: CHARIS_FILTER OBE_ID=SCEXAO OBE_MODE=INFRA_RED SLOT=$VAL01
    params:
      - [ VAL01, LIST, [ "J", "H", "K", "OUT" ], "Slot" ]

  -
    label: "IRCam Filter"
    cmd: IRCAM_FILTER OBE_ID=SCEXAO OBE_MODE=INFRA_RED SLOT=$VAL01
    params:
      - [ VAL01, LIST, [ "OPEN", "Y", "1550NM25NM", "1550NM50NM", "J", "H" ], "Slot" ]

  - sep

  -
    label: "IRCam Focus"
    cmd: IRCAM_FCS OBE_ID=SCEXAO OBE_MODE=INFRA_RED MODE=$VAL01
    params:
      - [ VAL01, LIST, [ "PALILA", "APAPANE"], "Mode" ]

  -
    label: "Apapane Pickoff"
    cmd: APAPANE_PICKOFF OBE_ID=SCEXAO OBE_MODE=INFRA_RED POSITION=$VAL01
    params:
      - [ VAL01, LIST, [ "'IN'", "OUT"], "Position" ]

  -
    label: "IR Field Stop"
    cmd: FIELD_STOP OBE_ID=SCEXAO OBE_MODE=INFRA_RED POSITION=$VAL01
    params:
      - [ VAL01, LIST, [ "'IN'", "OUT" ], "Position" ]

  -
    label: "CHARIS Wollaston"
    cmd: CHARIS_WOLLASTON OBE_ID=SCEXAO OBE_MODE=INFRA_RED POSITION=$VAL01
    params:
      - [ VAL01, LIST, [ "'IN'", "OUT" ], "Position" ]

  -
    label: "IRCam Wollaston"
    cmd: IRCAM_WOLLASTON OBE_ID=SCEXAO OBE_MODE=INFRA_RED POSITION=$VAL01
    params:
      - [ VAL01, LIST, [ "'IN'", "OUT" ], "Position" ]

  - sep

  -
    label: "Reach Pickoff"
    cmd: REACH_PICKOFF OBE_ID=SCEXAO OBE_MODE=INFRA_RED  POSITION=$VAL01
    params:
      - [ VAL01, LIST, [ "'IN'", "OUT" ], "Position" ]

  - sep


  -
    label: "Palila Parameters"
    cmd: PALILA_PARAMETERS OBE_ID=SCEXAO OBE_MODE=INFRA_RED NDR=$VAL01
# ask Garima or Olivier for default
    params:
      - [ VAL01, LIST, [ "1", "2", "4", "8", "16", "32", "64", "128", "255" ], "NDR" ]

  -
    label: "Apapane Parameters"
    cmd: APAPANE_PARAMETERS OBE_ID=SCEXAO OBE_MODE=INFRA_RED WINDOW=$VAL01 FPS_HZ=$VAL02 EM_GAIN=$VAL03
# ask Garima or Olivier for defaults
    params:
      - [ VAL01, LIST, [ "FULL", "PDI" ], "Window" ]
      - [ VAL01, LIST, [ "MAX", "2000", "1000", "500", "200", "100", "50", "20", "10", "5", "2" ], "FPS_HZ" ]
      - [ VAL01, LIST, [ "1", "2", "4", "8", "16", "32", "64", "104" ], "EM_Gain" ]

  -
    label: "Sleep"
    cmd: SLEEP OBE_ID=SCEXAO OBE_MODE=INFRA_RED SLEEP_TIME=$VAL01
    params:
      - [ VAL01, INPUT, 3, 2, "Seconds" ]

  - sep
