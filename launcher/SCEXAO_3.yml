# 
# SCEXAO.yml -- SCEXAO launchers file 
#
# This is a YAML file

tabname: "SCEXAO Vis"
launchers:
  -
    label: "PYWFS_Pickoff"
    cmd: EXEC SCEXAO PYWFS_PICKOFF SLOT=$VAL01
    params:
      - [ VAL01, LIST, [ "MIRROR", "700NMSP", "750NMSP", "800NMSP" ], "Slot" ]

  -
    label: "PYWFS_Filter"
    cmd: EXEC SCEXAO PYWFS_FILTER SLOT=$VAL01
    params:
      - [ VAL01, LIST, [ "OPEN", "BLOCK" ], "Slot" ]

  - sep

  -
    label: "FirstPL_Pickoff"
    cmd: EXEC SCEXAO FIRSTPL_PICKOFF POSITION=$VAL01
    params:
      - [ VAL01, LIST, [ "IN", "OUT" ], "Position" ]
