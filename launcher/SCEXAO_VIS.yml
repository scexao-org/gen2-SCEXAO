# 
# SCEXAO.yml -- SCEXAO launchers file 
#
# This is a YAML file

tabname: "SCEXAO Vis"
launchers:
  -
    label: "PYWFS_Pickoff"
    cmd: PYWFS_PICKOFF OBE_ID=SCEXAO OBE_MODE=VISIBLE SLOT=$VAL01
    params:
      - [ VAL01, LIST, [ "MIRROR", "700NMSP", "750NMSP", "800NMSP" ], "Slot" ]

  -
    label: "PYWFS_Filter"
    cmd: PYWFS_FILTER OBE_ID=SCEXAO OBE_MODE=VISIBLE SLOT=$VAL01
    params:
      - [ VAL01, LIST, [ "OPEN", "BLOCK" ], "Slot" ]

  -
    label: "Setup_PYWFS"
    cmd: SETUP_PYWFS OBE_ID=SCEXAO OBE_MODE=VISIBLE FREQUENCY=$VAL01 MOD_AMP=$VAL02
    params:
      - [ VAL01, LIST, [ "500","1000", "1500", "2000", "2500", "3000", "3500" ], "Frequency" ]
      - [ VAL02, LIST, [ "0.1", "0.2", "0.3", "0.4" ], "Mod_Amp" ]

  - sep

  -
    label: "Pueo_EM_Gain"
    cmd: PYWFS_EMGAIN OBE_ID=SCEXAO OBE_MODE=VISIBLE EM_GAIN=$VAL01
    params:
      - [ VAL01, LIST, [ "AUTO","1", "2", "4", "8", "16", "32", "64", "128", "256", "600" ], "EM_Gain" ]

 -
    label: "EMGain_Reset"
    cmd: EMGAIN_RESET OBE_ID=SCEXAO OBE_MODE=VISIBLE EMGAIN_RESET

  - sep

  -
    label: "Set_PYWFS_Loop_Gain"
    cmd: SET_PYWFS_LOOP_GAIN OBE_ID=SCEXAO OBE_MODE=VISIBLE GAIN=$VAL01
    params:
      - [ VAL01, INPUT, 6, 0, "Gain"]

  - sep

  -
    label: "Set_Mult_Factor"
    cmd: SET_MULT_FACTOR OBE_ID=SCEXAO OBE_MODE=VISIBLE FACTOR=$VAL01
    params:
      - [ VAL01, INPUT, 6, 0, "Factor"]

  -
    label: "Set_Modal_Gains"
    cmd: SET_MODAL_GAINS OBE_ID=SCEXAO OBE_MODE=VISIBLE

  -
    label: "Loop"
    cmd: LOOP OBE_ID=SCEXAO OBE_MODE=VISIBLE STATE=$VAL01
    params:
      - [ VAL01, LIST, [ "CLOSE", "OPEN", "ZERO"], "State"]

  -
    label: "DM_Offload"
    cmd: DM_OFFLOAD OBE_ID=SCEXAO OBE_MODE=VISIBLE STATE=$VAL01
    params:
      - [ VAL01, LIST, [ "ON", "OFF"], "State"]

  - sep

  -
    label: "FirstPL_Pickoff"
    cmd: FIRSTPL_PICKOFF OBE_ID=SCEXAO OBE_MODE=VISIBLE POSITION=$VAL01
    params:
      - [ VAL01, LIST, [ "'IN'", "OUT" ], "Position" ]
