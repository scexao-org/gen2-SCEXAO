# 
# SCEXAO.yml -- SCEXAO launchers file 
#
# This is a YAML file

tabname: "SCEXAO Setup"
launchers:


  -
    label: "Startup SCExAO"
    cmd: STARTUP_SCEXAO OBE_ID=SCEXAO OBE_MODE=SETUP MODE=$VAL01
    params:
      - [ VAL01, LIST, [ "CALIBRATION","ONSKY" ], "Mode" ]

  -
    label: "Shutdown SCExAO"
    cmd: SHUTDOWN_SCEXAO OBE_ID=SCEXAO OBE_MODE=SETUP

  -
    label: "Set Mode"
# ask Olivier/Garima what to put for default
    cmd: SET_MODE OBE_ID=SCEXAO OBE_MODE=SETUP MODE=$VAL01
    params:
      - [ VAL01, LIST, ["CHARIS", "CHARISPDI", "CHARISPDI+FPDI", "REACH" ], "Mode" ]

  - sep

  -
    label: "Source fiber"
    cmd: SRC_FIB OBE_ID=SCEXAO OBE_MODE=SETUP POSITION=$VAL01
    params:
      - [ VAL01, LIST, [ "'IN'", "OUT", "PINHOLE" ], "Position" ]

  -
    label: "WFS Acquisition"
    cmd: WFS_ACQUISITION OBE_ID=SCEXAO OBE_MODE=SETUP MODE=$VAL01
    params:
      - [ VAL01, LIST, [ "START", "STOP" ], "Mode" ]

  -
    label: "OAP1"
    cmd: OAP1 OBE_ID=SCEXAO OBE_MODE=SETUP POSITION=$VAL01
    params:
      - [ VAL01, LIST, [ "INT", "CWFS", "NIRWFS" ], "Position" ]

  - sep

  -
    label: "Superk"
    cmd: SUPERK OBE_ID=SCEXAO OBE_MODE=SETUP POWER=$VAL01
    params:
      - [ VAL01, LIST, [ "ON","OFF" ], "Power" ]

  -
    label: "Source Flux"
    cmd: SRC_FLUX OBE_ID=SCEXAO OBE_MODE=SETUP MODE=$VAL01
    params:
      - [ VAL01, LIST, [ "DEFAULT","CHARIS", "MIN" ], "Mode" ]

  - sep

  -
    label: "Astrogrid"
    cmd: ASTROGRID OBE_ID=SCEXAO OBE_MODE=SETUP STATE=$VAL01 AMPLITUDE=$VAL02 MODE=$VAL03
    params:
      - [ VAL01, LIST, [ "ON", "OFF" ], "State" ]
      - [ VAL02, INPUT, 6, 0, "Amplitude (nm)" ]
      - [ VAL03, LIST, [ "PDI", "IMAGING" ], "Mode" ]

  -
    label: "SCExAO DM"
    cmd: SCEXAO_DM OBE_ID=SCEXAO OBE_MODE=SETUP STATE=$VAL01
    params:
      - [ VAL01, LIST, [ "FLAT", "ZERO", "FOCUS_ON", "FOCUS_OFF" ], "State" ]


